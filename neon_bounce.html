<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge Catapult - Advanced Physics</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --panel-bg: #1e293b;
            --accent: #f59e0b;
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 10%, #243b67 0%, #111827 42%, #070b14 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            background: linear-gradient(145deg, rgba(30,41,59,.96), rgba(15,23,42,.96));
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
            width: min(1180px, calc(100vw - 32px));
            border: 1px solid rgba(148,163,184,.2);
        }

        /* Panneau de contrôle */
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: linear-gradient(180deg, #111c31, #0a1020);
            padding: 22px;
            border-radius: 18px;
            border: 1px solid rgba(148,163,184,.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .bet-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 12px;
            font-size: 20px;
            border-radius: 5px;
            box-sizing: border-box;
            text-align: right;
            font-family: monospace;
            font-weight: bold;
        }

        .btn {
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-bet { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
        .btn-bet:hover { background: #fbbf24; transform: translateY(-2px); }
        .btn-bet:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none;}
        
        .btn-sim { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; margin-top: auto; font-size: 14px; padding: 10px; }
        .btn-sim:hover { background: rgba(56, 189, 248, 0.1); }

        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            font-size: 13px;
            color: #94a3b8;
            line-height: 2;
        }
        .stats div { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .stats span { float:none; color: white; font-family: monospace; font-size: 15px; white-space:nowrap; }

        /* Écran de jeu */
        .game-screen {
            flex: 2.5;
            background: linear-gradient(180deg, #78d8ff 0%, #b9efff 52%, #e7f8ff 100%);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.35);
            height: 450px;
            isolation: isolate;
            box-shadow: inset 0 0 0 1px rgba(15,23,42,.18), 0 14px 30px rgba(0,0,0,.25);
            transition: background-color 2s ease;
        }
        .game-screen::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 35%, rgba(15,23,42,.08));
            pointer-events: none; z-index: 1;
        }
        .game-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at 82% 17%, rgba(255,249,196,.95) 0 22px, rgba(255,218,112,.16) 23px 58px, transparent 59px), linear-gradient(180deg, transparent 0 64%, rgba(255,255,255,.08) 64.2% 64.7%, transparent 65%);
            mix-blend-mode: screen;
        }

        /* Monde 2D avec caméra : la catapulte et le décor existent dans le même espace. */
        .world-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: translate3d(0,0,0);
            transform-origin: left top;
            will-change: transform;
            z-index: 0;
        }
        .world-layer > * { will-change: left, transform; }
        .far-layer {
            position: absolute;
            inset: 0;
            width: 120000px;
            height: 100%;
            pointer-events: none;
            will-change: transform;
            z-index: 2;
        }
        .far-layer .hill, .far-layer .cloud { pointer-events:none; }
        .ground {
            width: 120000px;
        }
        .world-marker {
            position:absolute;
            bottom:60px;
            width:2px;
            height:150px;
            background:linear-gradient(180deg,transparent,rgba(255,255,255,.12));
            z-index:6;
            pointer-events:none;
        }
        .scenery.generated { z-index:8; }
        .camera-vignette {
            position:absolute;
            inset:0;
            pointer-events:none;
            z-index:25;
            box-shadow: inset 0 0 80px rgba(7,11,20,.18);
        }
        .speed-lines {
            position:absolute;
            left:0; right:0;
            top:18%;
            height:46%;
            overflow:hidden;
            pointer-events:none;
            z-index:23;
            opacity:0;
            transition:opacity .25s ease;
        }
        .speed-lines.active { opacity:.38; }
        .speed-lines i {
            position:absolute;
            height:2px;
            width:60px;
            background:rgba(255,255,255,.65);
            border-radius:2px;
            transform:translateX(-120px);
            animation:speedline 0.45s linear infinite;
        }
        .speed-lines i:nth-child(1){top:12%;animation-delay:.02s}.speed-lines i:nth-child(2){top:23%;width:92px;animation-delay:.16s}.speed-lines i:nth-child(3){top:39%;width:50px;animation-delay:.08s}.speed-lines i:nth-child(4){top:55%;width:110px;animation-delay:.28s}.speed-lines i:nth-child(5){top:71%;width:72px;animation-delay:.1s}.speed-lines i:nth-child(6){top:84%;width:42px;animation-delay:.22s}
        @keyframes speedline { to { transform:translateX(1200px); } }

        .catapult-base.launching .arm {
            animation: armKick .34s cubic-bezier(.2,.85,.25,1) both;
        }
        .catapult-base.launching .rope {
            animation: ropeSnap .34s ease-out both;
        }
        .catapult-base.launching .cup {
            animation: cupKick .34s ease-out both;
        }
        @keyframes armKick { 0%{transform:translateX(-50%) rotate(-28deg)} 45%{transform:translateX(-50%) rotate(34deg)} 100%{transform:translateX(-50%) rotate(18deg)} }
        @keyframes ropeSnap { 0%{transform:translateX(-50%) rotate(-28deg) scaleY(1.15)} 100%{transform:translateX(-50%) rotate(16deg) scaleY(.5);opacity:.3} }
        @keyframes cupKick { 0%{transform:translateX(-50%) rotate(0)} 60%{transform:translateX(-50%) rotate(20deg)} 100%{transform:translateX(-50%) rotate(10deg)} }
        .dog.airborne { filter:drop-shadow(0 12px 5px rgba(0,0,0,.28)); }
        .dog.airborne::after {
            content:'';
            position:absolute;
            width:70px;height:10px;
            left:-12px;top:34px;
            background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.3),rgba(255,255,255,0));
            filter:blur(3px);
            transform:skewX(-18deg);
            opacity:.65;
        }
        .cloud { position:absolute; width:120px; height:34px; background:rgba(255,255,255,.7); border-radius:40px; filter:blur(.2px); z-index:2; }
        .cloud::before,.cloud::after { content:''; position:absolute; background:inherit; border-radius:50%; }
        .cloud::before { width:52px;height:52px;left:18px;bottom:5px; }
        .cloud::after { width:68px;height:68px;right:14px;bottom:0; }
        .hill { position:absolute; bottom:60px; width:520px;height:220px; background:linear-gradient(180deg,#6fc58b,#27745d); clip-path:polygon(0 100%,0 62%,17% 34%,33% 58%,53% 10%,74% 54%,100% 25%,100% 100%); z-index:3; opacity:.9; }
        .hill.far { height:170px; background:linear-gradient(180deg,#a8d5a4,#5c9a7a); opacity:.65; clip-path:polygon(0 100%,0 64%,22% 30%,42% 58%,63% 18%,82% 55%,100% 34%,100% 100%); }
        .far-layer::before { content:''; position:absolute; left:0; bottom:60px; width:100%; height:210px; background:linear-gradient(155deg,#84c5ae,#487f83); clip-path:polygon(0 100%,0 56%,12% 26%,24% 63%,38% 12%,55% 61%,70% 30%,86% 59%,100% 18%,100% 100%); opacity:.42; }
        .far-layer::after { content:''; position:absolute; left:0; bottom:60px; width:100%; height:155px; background:linear-gradient(155deg,#427a72,#24535b); clip-path:polygon(0 100%,0 62%,14% 38%,28% 68%,44% 24%,58% 69%,75% 35%,89% 66%,100% 28%,100% 100%); opacity:.72; }
        .tree { position:absolute; bottom:60px; z-index:7; font-size:58px; filter:drop-shadow(0 8px 4px rgba(0,0,0,.2)); }
        .rock { position:absolute; bottom:60px; z-index:8; font-size:34px; filter:drop-shadow(0 5px 3px rgba(0,0,0,.25)); }
        .decor-tree, .decor-bush, .decor-rock { position:relative; display:block; }
        .decor-tree { width:54px; height:108px; border-radius:8px 8px 4px 4px; background:linear-gradient(90deg,#573b28 0 25%,#8b5a35 26% 48%,#4b3020 49%); }
        .decor-tree::before, .decor-tree::after { content:''; position:absolute; left:50%; transform:translateX(-50%); border-radius:50%; background:linear-gradient(135deg,#4f9b61,#17634d); box-shadow:inset -9px -8px 0 rgba(19,73,57,.35), 0 5px 0 rgba(16,65,51,.22); }
        .decor-tree::before { top:-42px; width:92px; height:78px; }
        .decor-tree::after { top:-78px; width:68px; height:68px; }
        .decor-bush { width:88px; height:34px; border-radius:48px 48px 12px 12px; background:radial-gradient(circle at 25% 55%,#75c66e 0 27%,transparent 28%),radial-gradient(circle at 52% 35%,#4fa95f 0 34%,transparent 35%),radial-gradient(circle at 78% 58%,#368b55 0 30%,transparent 31%),#27764c; }
        .decor-rock { width:58px; height:29px; border-radius:70% 55% 35% 25%; background:linear-gradient(145deg,#a3adb0,#59666d 55%,#37434b); transform:rotate(-7deg); box-shadow:inset -7px -5px 0 rgba(31,42,48,.3), 0 5px 3px rgba(0,0,0,.2); }

        /* Lignes de repère (Grille de fond) */
        .grid-bg {
            position: absolute;
            width: 200%; height: 100%;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 1px, transparent 2px);
            background-size: 90px 90px;
            opacity:.28; z-index:4;
        }

        .ground {
            position: absolute;
            bottom: 0; width: 200%; height: 60px;
            background: linear-gradient(180deg,#5fbf63 0%,#287343 42%,#17452d 100%);
            border-top: 6px solid #2d6a3b;
            box-shadow: inset 0 10px 0 rgba(255,255,255,.08);
            transition: background-color 2s;
            z-index: 10;
        }
        .ground::before { content:''; position:absolute; top:-12px; left:0; width:100%; height:18px; background:repeating-linear-gradient(105deg, transparent 0 18px, rgba(255,255,255,.22) 19px 21px, transparent 22px 38px); opacity:.5; }

        /* UI de jeu */
        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
        }
        .distance { font-size: 30px; font-family: monospace; font-weight: bold; color: white; text-shadow: 0 2px 5px #000; }
        .multiplier { font-size: 40px; font-weight: 900; color: rgba(255,255,255,0.4); transition: color 0.3s, transform 0.3s; }
        .multiplier.active { color: #10b981; transform: scale(1.2); text-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .multiplier.lost { color: #ef4444; }

        /* Acteurs */
        .catapult-base {
            position:absolute; left:24px; bottom:48px; width:158px; height:146px; z-index:14;
            filter:drop-shadow(0 14px 8px rgba(0,0,0,.28));
        }
        .catapult-base::before { content:''; position:absolute; left:0; right:0; bottom:8px; height:24px; background:linear-gradient(#c6813e,#6b391b); border:4px solid #2b170d; border-radius:10px; box-shadow:0 18px 0 -3px #392317, 0 22px 0 -4px #17151a; }
        .catapult-base::after { content:''; position:absolute; left:10px; bottom:-2px; width:22px; height:22px; border:5px solid #17151a; border-radius:50%; background:#8b633c; box-shadow:112px 0 0 -5px #8b633c, 112px 0 0 0 #17151a; }
        .catapult-base .leg { position:absolute; bottom:22px; width:32px; height:112px; background:linear-gradient(90deg,#4a2814,#b87539 45%,#3b2112); border:3px solid #2b170d; border-radius:8px 8px 3px 3px; transform-origin:bottom; }
        .catapult-base .leg.left { left:22px; transform:rotate(12deg); }
        .catapult-base .leg.right { right:22px; transform:rotate(-12deg); }
        .catapult-base .crossbar { position:absolute; left:14px; right:14px; bottom:35px; height:22px; background:linear-gradient(#c6813e,#5b3218); border:3px solid #2b170d; border-radius:8px; z-index:2; }
        .catapult-base .pivot { position:absolute; left:50%; top:46px; width:32px; height:32px; transform:translateX(-50%); background:radial-gradient(circle at 35% 30%,#f6d28b 0 15%,#9b5b28 18% 58%,#3b2112 62%); border:4px solid #2b170d; border-radius:50%; z-index:3; box-shadow:0 0 0 4px rgba(255,210,132,.2); }
        .catapult-base .arm { position:absolute; left:50%; top:4px; width:20px; height:124px; transform:translateX(-50%) rotate(-27deg); transform-origin:50% 48px; background:linear-gradient(90deg,#3b2112,#c17a3d 45%,#5a3218); border:3px solid #2b170d; border-radius:12px; z-index:2; }
        .catapult-base .cup { position:absolute; left:50%; top:0; transform:translateX(-50%); width:38px; height:24px; border:5px solid #3b2112; border-top:0; border-radius:0 0 22px 22px; background:#a86632; z-index:4; }
        .catapult-base .rope { position:absolute; left:50%; top:8px; width:3px; height:60px; background:#e7c58d; transform:translateX(-50%) rotate(-27deg); transform-origin:top; z-index:1; opacity:.9; }
        .sling-band { position:absolute; bottom:130px; left:84px; width:4px; height:72px; background:#d8bd8c; transform-origin:top center; z-index:15; opacity:.9; }
        .dog { font-size:50px; position:absolute; bottom:60px; left:58px; z-index:20; transform-origin:center; transition:transform .05s linear; filter:drop-shadow(0 7px 3px rgba(0,0,0,.25)); }
        .dust { position:absolute; width:10px; height:10px; border-radius:50%; background:rgba(226,193,130,.7); z-index:16; pointer-events:none; animation:dust .55s ease-out forwards; }
        @keyframes dust { from{transform:translate(0,0) scale(.5);opacity:.8} to{transform:translate(var(--dx),var(--dy)) scale(2);opacity:0} }

        /* Objets du décor */
        .scenery-item {
            position: absolute; bottom: 60px; z-index: 12; font-size: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }
        .sign-text {
            background: #78350f; color: white; padding: 2px 8px; border-radius: 4px;
            border: 2px solid #451a03; font-weight: bold; font-family: monospace; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: -10px; z-index: 2;
        }
        .sign-post {
            width: 8px; height: 40px; background: #451a03;
        }

        .bounce-object {
            font-size: 50px; position: absolute; bottom: 60px; z-index: 15;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .stop-object {
            font-size: 60px; position: absolute; bottom: 55px; z-index: 18;
            filter: grayscale(40%);
        }
        .bounce-pad { position:relative; width:96px; height:24px; border:4px solid #26344e; border-radius:50%; background:linear-gradient(#ffdd63,#ef7b36); box-shadow:0 8px 0 #b53e36, 0 12px 8px rgba(0,0,0,.28); }
        .bounce-pad::before { content:'+'; position:absolute; left:50%; top:50%; transform:translate(-50%,-58%); color:#fff8d0; font:bold 24px monospace; text-shadow:0 2px 0 #b53e36; }
        .bounce-pad::after { content:''; position:absolute; left:50%; top:22px; width:12px; height:30px; transform:translateX(-50%); background:linear-gradient(90deg,#40536b,#9aa8b5,#40536b); border:2px solid #26344e; z-index:-1; }
        .bounce-pad.used { filter:grayscale(.8); opacity:.55; }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    @media (max-width: 850px) { body { overflow:auto; padding:16px 0; align-items:flex-start; } .container { flex-direction:column; } .controls { order:2; } .game-screen { order:1; width:100%; height:420px; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <div class="input-group">
                <label>Montant de la mise (€)</label>
                <input type="number" id="bet-amount" class="bet-input" value="1.00" step="1.00" min="1.00">
            </div>
            
            <button type="button" class="btn btn-bet" id="btn-bet">LANCER LE DOGE</button>
            <div id="game-status" style="min-height:20px;text-align:center;color:#94a3b8;font-size:12px;letter-spacing:.04em;"></div>
            
            <div class="stats">
                <div>Bankroll Joueur <span id="stat-balance">999.50 €</span></div>
                <div>Profit Casino <span id="stat-casino">1297.50 €</span></div>
                <div>RTP Théorique <span>96.00 %</span></div>
                <div>RTP Expérimental <span id="stat-rtp">96.76 %</span></div>
                <div>Lancements <span id="stat-spins">40 050</span></div>
            </div>

            <button type="button" class="btn-sim" id="btn-sim">⚡ Audit (10 000 Lancements)</button>
        </div>

        <div class="game-screen" id="game-screen">
            <div class="hud">
                <div class="distance"><span id="dist-val">0</span> m</div>
                <div class="multiplier" id="mult-val">0.00x</div>
            </div>

            <div class="world-layer" id="world-layer">
                <div class="far-layer" id="far-layer">
                    <div class="cloud" style="top:72px;left:24px;opacity:.75"></div>
                    <div class="cloud" style="top:145px;left:330px;transform:scale(.7);opacity:.5"></div>
                    <div class="cloud" style="top:205px;left:760px;transform:scale(.55);opacity:.35"></div>
                    <div class="hill far" style="left:-80px"></div>
                    <div class="hill far" style="left:640px;height:145px"></div>
                    <div class="hill" style="left:220px"></div>
                    <div class="hill" style="left:920px;height:160px"></div>
                </div>
                <div class="grid-bg" id="grid-bg"></div>

                <div class="catapult-base" id="catapult" aria-label="Catapulte en bois">
                    <div class="leg left"></div><div class="leg right"></div>
                    <div class="crossbar"></div><div class="rope"></div><div class="arm"></div>
                    <div class="cup"></div><div class="pivot"></div>
                </div>
                <div class="sling-band" id="sling"></div>
                <div class="dog" id="dog">🐕</div>

                <div class="ground" id="ground"></div>
                <div id="objects-layer"></div>
            </div>
            <div class="speed-lines" id="speed-lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="camera-vignette"></div>
        </div>
    </div>

    <script>
        // --- MOTEUR AUDIO ---
        let audioCtx;
        function initAudio() {
            try {
                const AudioCtor = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtor) return false;
                if (!audioCtx) audioCtx = new AudioCtor();
                if (audioCtx.state === 'suspended') {
                    const resumeResult = audioCtx.resume();
                    if (resumeResult && typeof resumeResult.catch === 'function') resumeResult.catch(() => {});
                }
                return true;
            } catch (err) {
                audioCtx = null;
                return false;
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'tension') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, now);
                osc.frequency.linearRampToValueAtTime(150, now + 1.0);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
            } else if (type === 'launch') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1500, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'bounce') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'milestone') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
            } catch (err) {}
        }

        // --- MATHÉMATIQUES (RTP Exact 96.00%) ---
        const PAYTABLE = [
            { prob: 0.329, mult: 0,   minD: 10,   maxD: 99 },
            { prob: 0.200, mult: 0.2, minD: 100,  maxD: 199 },
            { prob: 0.100, mult: 0.5, minD: 200,  maxD: 399 },
            { prob: 0.100, mult: 1.1, minD: 400,  maxD: 699 },
            { prob: 0.100, mult: 1.5, minD: 700,  maxD: 999 },
            { prob: 0.080, mult: 2.0, minD: 1000, maxD: 1499 },
            { prob: 0.050, mult: 3.0, minD: 1500, maxD: 2499 },
            { prob: 0.030, mult: 5.0, minD: 2500, maxD: 4999 },
            { prob: 0.010, mult: 10.0,minD: 5000, maxD: 9999 },
            { prob: 0.001, mult: 50.0,minD: 10000,maxD: 15000 }
        ];

        let balance = 999.50;
        let totalSpent = 40050; 
        let totalWon = 38752.50; 
        let spins = 40050;

        function getOutcome() {
            let r = Math.random();
            let cumulative = 0;
            for (let tier of PAYTABLE) {
                cumulative += tier.prob;
                if (r <= cumulative) {
                    const finalDistance = Math.floor(Math.random() * (tier.maxD - tier.minD + 1)) + tier.minD;
                    return { mult: tier.mult, dist: finalDistance };
                }
            }
            return { mult: 0, dist: 50 }; 
        }

        // --- PHYSIQUE, CAMÉRA ET ENVIRONNEMENT ---
        let isFlying = false;
        let currentDist = 0;
        let targetOutcome = null;
        let currentMultAchieved = 0;

        let worldX = 58;          
        let posY = 82;            
        let vX = 0, vY = 0;
        let rotation = 0;
        let cameraX = 0;
        let flightPhase = 'ready';
        let lastTime = 0;
        let nextSceneryX = 70;
        let activeBouncers = [];

        // Vraies constantes physiques corrigées
        const gravity = 32;
        const airDrag = 0.9995;
        const simulationSpeed = 2.4;
        const pixelPerMeter = 1.45;

        const dogEl = document.getElementById('dog');
        const distEl = document.getElementById('dist-val');
        const multEl = document.getElementById('mult-val');
        const objectsLayer = document.getElementById('objects-layer');
        const screenEl = document.getElementById('game-screen');
        const groundEl = document.getElementById('ground');
        const slingEl = document.getElementById('sling');
        const catapultEl = document.getElementById('catapult');
        const worldEl = document.getElementById('world-layer');
        const farLayerEl = document.getElementById('far-layer');
        const speedLinesEl = document.getElementById('speed-lines');
        const statusEl = document.getElementById('game-status');

        const bounceEmojis = ['🍄','🛏️','🍮','🎈','☁️'];

        const BIOMES = [
            { dist: 0,    bg: 'linear-gradient(180deg,#69cbf2 0%,#bfefff 56%,#e7f8ff 100%)', ground: 'linear-gradient(180deg,#63c96d 0%,#2f7d46 44%,#17452d 100%)' },
            { dist: 200,  bg: 'linear-gradient(180deg,#f39b62 0%,#ffd18a 54%,#f7e2b7 100%)', ground: 'linear-gradient(180deg,#b8792d 0%,#81501d 44%,#4a2d13 100%)' },
            { dist: 700,  bg: 'linear-gradient(180deg,#a878d7 0%,#e1a8df 48%,#f1cfba 100%)', ground: 'linear-gradient(180deg,#754b78 0%,#4b2e4d 44%,#281b2d 100%)' },
            { dist: 2500, bg: 'linear-gradient(180deg,#162d68 0%,#254b9a 48%,#56689a 100%)', ground: 'linear-gradient(180deg,#2c4c86 0%,#1f335d 44%,#111a2e 100%)' },
            { dist: 5000, bg: 'linear-gradient(180deg,#08152f 0%,#172f58 54%,#496d78 100%)', ground: 'linear-gradient(180deg,#467b5b 0%,#244c40 45%,#142d2d 100%)' }
        ];

        let activeSigns = [];

        function getViewportWidth() { return Math.max(360, screenEl.clientWidth || 900); }

        function applyCamera(snap=false) {
            const viewW = getViewportWidth();
            const desiredCamera = Math.max(0, worldX * pixelPerMeter - viewW * 0.34);
            const follow = snap ? 1 : 0.12;
            cameraX += (desiredCamera - cameraX) * follow;

            worldEl.style.transform = `translate3d(${-cameraX}px,0,0)`;
            farLayerEl.style.transform = `translate3d(${cameraX * 0.76}px,0,0)`;
        }

        function updateWorldEntities() {
            dogEl.style.left = `${worldX * pixelPerMeter - 25}px`;
            dogEl.style.bottom = '60px';
            catapultEl.style.left = '24px';
            slingEl.style.left = '84px';
        }

        function prepareLaunch() {
            const btn = document.getElementById('btn-bet');
            initAudio(); 
            const bet = parseFloat(document.getElementById('bet-amount').value);
            
            if (balance < bet) {
                statusEl.textContent = 'Fonds insuffisants.';
                return;
            }

            if (window._launchTimeout) clearTimeout(window._launchTimeout);
            if (window._tensionInterval) clearInterval(window._tensionInterval);
            
            btn.disabled = true;
            statusEl.textContent = 'La catapulte se tend…';
            multEl.className = 'multiplier';
            multEl.innerText = '0.00x';
            objectsLayer.innerHTML = '';
            activeSigns = [];
            activeBouncers = [];
            currentMultAchieved = 0;
            currentDist = 0;
            worldX = 58;
            posY = 82;
            cameraX = 0;
            nextSceneryX = 70;
            updateWorldEntities();
            applyCamera(true);

            balance -= bet;
            totalSpent += bet;
            spins++;
            targetOutcome = getOutcome();

            playSound('tension');
            catapultEl.classList.remove('launching');
            let t = 0;
            
            window._tensionInterval = setInterval(() => {
                t += 0.05;
                const pull = Math.min(1, t);
                const tx = -24 * pull;
                const ty = 28 * pull;
                dogEl.style.transform = `translate(${tx}px, ${-ty}px) rotate(${-8 - 18*pull}deg)`;
                slingEl.style.transform = `rotate(${-45 - 10*pull}deg) scaleY(${1 + .9*pull})`;
                if (pull >= 1) clearInterval(window._tensionInterval);
            }, 45);

            window._launchTimeout = setTimeout(() => {
                clearInterval(window._tensionInterval);
                launchGame();
            }, 950);
        }

        function launchGame() {
            playSound('launch');
            catapultEl.classList.add('launching');
            setTimeout(() => catapultEl.classList.remove('launching'), 420);
            slingEl.style.transform = 'rotate(0deg) scaleY(1)';

            currentDist = 0;
            worldX = 58;
            posY = 82;
            rotation = -8;
            flightPhase = 'air';
            isFlying = true;
            cameraX = Math.max(0, cameraX - 14);

            // MOTEUR BALISTIQUE INTELLIGENT
            const desiredRangeMeters = targetOutcome.dist;
            const firstJumpDistMeters = desiredRangeMeters * 0.70; // Vise 70% de la distance au premier bond
            const angle = (35 + Math.random() * 10) * Math.PI / 180;
            
            // v = sqrt(d * g / sin(2*angle))
            const idealSpeed = Math.sqrt((firstJumpDistMeters * gravity) / Math.sin(2 * angle));
            const speed = Math.min(340, Math.max(42, idealSpeed));
            
            vX = speed * Math.cos(angle);
            vY = speed * Math.sin(angle);

            dogEl.classList.add('airborne');
            speedLinesEl.classList.add('active');
            statusEl.textContent = 'VOL — la caméra suit le Doge';
            updateStats();
            
            lastTime = performance.now();
            requestAnimationFrame(physicsLoop);
        }

        function physicsLoop(time) {
            if (!isFlying) return;
            const dt = Math.min(0.05, (time - lastTime) / 1000) * simulationSpeed;
            lastTime = time;

            if (flightPhase === 'air') {
                vY -= gravity * dt;
                vX *= Math.pow(airDrag, dt * 60);
                worldX += vX * dt;
                posY += vY * dt;
                rotation = Math.atan2(vY, vX) * (180 / Math.PI); // Le nez pointe la trajectoire
            } 
            else if (flightPhase === 'rolling') {
                vY = 0;
                let remainingMeters = targetOutcome.dist - currentDist;
                
                // FREINAGE PARFAIT (v^2 = 2ad -> a = v^2 / 2d)
                if (remainingMeters > 0) {
                    let decel = (vX * vX) / (2 * remainingMeters);
                    vX = Math.max(0, vX - decel * dt);
                    rotation += vX * dt * 5;
                    if (vX * dt >= remainingMeters) {
                        worldX = 58 + targetOutcome.dist;
                    } else {
                        worldX += vX * dt;
                    }
                } else {
                    worldX = 58 + targetOutcome.dist;
                }
            }

            currentDist = Math.max(0, worldX - 58);

            checkBouncerCollision();

            // GESTION DU SOL
            if (posY <= 0 && flightPhase === 'air') {
                posY = 0;
                let remainingDistMeters = targetOutcome.dist - currentDist;

                if (remainingDistMeters > 25) {
                    // Rebond balistique !
                    performBounce(remainingDistMeters);
                } 
                else if (remainingDistMeters > 0) {
                    // Passage en glissade/freinage
                    flightPhase = 'rolling';
                    posY = 0;
                    dogEl.classList.remove('airborne');
                } 
                else {
                    // Fin brutale si dépassement
                    currentDist = targetOutcome.dist;
                    worldX = 58 + currentDist;
                    performStop();
                    return;
                }
            }

            // GESTION DE L'ARRÊT FINAL
            if (flightPhase === 'rolling') {
                let remainingDistMeters = targetOutcome.dist - currentDist;
                if (remainingDistMeters <= 0.5 || vX <= 0.1) {
                    currentDist = targetOutcome.dist;
                    worldX = 58 + currentDist;
                    performStop();
                    return;
                }
                if (Math.random() < 0.3) spawnDust();
            }

            // RENDU UI & DÉCOR
            updateWorldEntities();
            applyCamera(false);
            updateScenery();
            checkEnvironment();

            const shake = Math.min(2.5, Math.abs(vX) * 0.05);
            gameShake(shake);

            dogEl.style.transform = `translateY(${-posY}px) rotate(${-rotation}deg)`;
            distEl.innerText = Math.floor(currentDist).toLocaleString('fr-FR');
            
            requestAnimationFrame(physicsLoop);
        }

        function checkBouncerCollision() {
            if (flightPhase !== 'air' || vY > 0 || posY > 18) return;
            const hit = activeBouncers.find(bouncer => !bouncer.used && Math.abs(currentDist - bouncer.distance) < 34);
            if (!hit) return;

            hit.used = true;
            hit.element.classList.add('used');
            posY = 1;
            performBounce(Math.max(30, targetOutcome.dist - currentDist), 1.45);
        }

        function performBounce(remainingDistMeters, power = 1) {
            playSound('bounce');
            
            // Calculer un saut qui couvre 60% de ce qu'il reste
            let bounceTarget = remainingDistMeters * Math.min(0.82, 0.6 * power);
            let angle = (30 + Math.random() * 15) * Math.PI / 180;
            let speed = Math.sqrt((bounceTarget * gravity) / Math.sin(2 * angle));
            
            vX = Math.min(240, Math.max(18, speed * Math.cos(angle) * (power > 1 ? 1.05 : 0.92)));
            vY = Math.min(150, Math.max(20, speed * Math.sin(angle) * (power > 1 ? 0.95 : 0.72)));

            posY = 2; // Décolle légèrement
            for(let i=0; i<3; i++) spawnDust();

            const bounceObj = document.createElement('div');
            bounceObj.className = 'bounce-object parallax-obj generated';
            bounceObj.innerText = bounceEmojis[Math.floor(Math.random()*bounceEmojis.length)];
            bounceObj.style.left = `${worldX * pixelPerMeter - 10}px`;
            bounceObj.dataset.depth = '1';
            objectsLayer.appendChild(bounceObj);
            
            setTimeout(() => { if (bounceObj.parentNode) bounceObj.remove(); }, 1000);
        }

        function gameShake(amount) {
            if (!isFlying) { screenEl.style.transform = ''; return; }
            const x = (Math.random() - 0.5) * amount;
            const y = (Math.random() - 0.5) * amount * 0.7;
            screenEl.style.transform = `translate3d(${x}px,${y}px,0)`;
        }

        function spawnDust() {
            const puff=document.createElement('div');
            puff.className='dust';
            puff.style.left=`${worldX * pixelPerMeter - 15}px`;
            puff.style.bottom='58px';
            puff.style.setProperty('--dx', `${-10-Math.random()*20}px`);
            puff.style.setProperty('--dy', `${-5-Math.random()*15}px`);
            objectsLayer.appendChild(puff);
            setTimeout(()=>puff.remove(),600);
        }

        function updateScenery() {
            while (nextSceneryX < currentDist + 1700) {
                const x = 58 + nextSceneryX;
                const el = document.createElement('div');
                el.className='generated scenery-item';
                el.style.left=`${x * pixelPerMeter}px`;
                
                const roll = Math.random();
                const decor = document.createElement('span');
                const isBouncer = nextSceneryX === 70 || (currentDist > 20 && roll > 0.30 && Math.random() < 0.45);
                decor.className = isBouncer ? 'bounce-pad' : roll < 0.18 ? 'decor-rock' : roll < 0.38 ? 'decor-bush' : 'decor-tree';
                if (decor.className === 'decor-tree') decor.style.transform = `scale(${(0.72 + Math.random() * 0.42).toFixed(2)})`;
                if (decor.className === 'decor-rock') decor.style.transform = `scale(${(0.65 + Math.random() * 0.6).toFixed(2)}) rotate(-7deg)`;
                el.appendChild(decor);
                if (isBouncer) activeBouncers.push({ distance: nextSceneryX, element: decor, used: false });
                
                el.style.opacity = (0.75 + Math.random()*.25).toFixed(2);
                objectsLayer.appendChild(el);
                setTimeout(()=>{ if(el.parentNode) el.remove(); }, 18000);
                nextSceneryX += 180 + Math.random()*420;
            }
        }

        function performStop() {
            isFlying = false;
            speedLinesEl.classList.remove('active');
            screenEl.style.transform = '';
            statusEl.textContent = 'Atterrissage terminé';
            dogEl.classList.remove('airborne');

            if (targetOutcome.mult === 0) {
                const stopObj = document.createElement('div');
                stopObj.className='stop-object generated';
                stopObj.innerText='🪨';
                stopObj.style.left=`${worldX * pixelPerMeter + 12}px`;
                objectsLayer.appendChild(stopObj);
            }

            dogEl.innerText = targetOutcome.mult > 1 ? '😎' : '😵';
            dogEl.style.transform = 'translateY(0) rotate(0deg)';

            const bet = parseFloat(document.getElementById('bet-amount').value);
            const winAmount = bet * targetOutcome.mult;
            balance += winAmount;
            totalWon += winAmount;

            if (targetOutcome.mult > 0) {
                multEl.innerText = targetOutcome.mult.toFixed(2) + 'x !';
                multEl.classList.add('active');
            } else {
                multEl.innerText='PERDU';
                multEl.classList.add('lost');
            }

            setTimeout(() => {
                document.getElementById('btn-bet').disabled=false;
                dogEl.innerText='🐕';
                statusEl.textContent = 'Prêt.';
                cameraX=0;
                applyCamera(true);
                updateStats();
            }, 1500);
        }

        function checkEnvironment() {
            let activeBiome=BIOMES[0];
            for (const b of BIOMES) if (currentDist >= b.dist) activeBiome=b;
            screenEl.style.background=activeBiome.bg;
            groundEl.style.background=activeBiome.ground;

            // Apparition des panneaux de distance
            for (const tier of PAYTABLE) {
                if (tier.mult > 0 && currentDist >= tier.minD - 260 && currentDist < tier.minD && !activeSigns.includes(tier.mult)) {
                    activeSigns.push(tier.mult);
                    spawnSign(tier.mult, tier.minD);
                }
            }

            // Maj du HUD
            let earnedMult=0;
            for (const tier of PAYTABLE) if (currentDist >= tier.minD && tier.mult > earnedMult) earnedMult=tier.mult;
            if (earnedMult > currentMultAchieved) {
                currentMultAchieved=earnedMult;
                multEl.innerText=earnedMult.toFixed(2)+'x';
                playSound('milestone');
                multEl.classList.add('active');
                setTimeout(()=>multEl.classList.remove('active'),400);
            }
        }

        function spawnSign(mult, targetDist) {
            const wrapper=document.createElement('div');
            wrapper.className='scenery-item parallax-obj generated';
            wrapper.style.left=`${(58 + targetDist) * pixelPerMeter}px`;
            
            const text=document.createElement('div');
            text.className='sign-text';
            text.innerText=`${mult}x`;
            
            const post=document.createElement('div');
            post.className='sign-post';
            
            wrapper.appendChild(text); 
            wrapper.appendChild(post);
            objectsLayer.appendChild(wrapper);
            
            setTimeout(()=>{ if(wrapper.parentNode) wrapper.remove(); }, 12000);
        }

        // --- AUDIT MONTE CARLO ---
        function runMonteCarlo() {
            const SIM_COUNT = 10000;
            const bet = parseFloat(document.getElementById('bet-amount').value);
            let simSpent = 0;
            let simWon = 0;

            for(let i = 0; i < SIM_COUNT; i++) {
                simSpent += bet;
                simWon += (bet * getOutcome().mult);
            }

            spins += SIM_COUNT;
            totalSpent += simSpent;
            totalWon += simWon;
            
            updateStats();
            alert(`Audit exécuté.\nRTP théorique : 96.00%\nRTP mesuré sur ces 10k parties : ${((simWon/simSpent)*100).toFixed(2)}%`);
        }

        function updateStats() {
            document.getElementById('stat-balance').innerText = balance.toFixed(2) + ' €';
            document.getElementById('stat-casino').innerText = (totalSpent - totalWon).toFixed(2) + ' €';
            document.getElementById('stat-spins').innerText = spins.toLocaleString();
            if (totalSpent > 0) {
                document.getElementById('stat-rtp').innerText = ((totalWon / totalSpent) * 100).toFixed(2) + ' %';
            }
        }

        document.getElementById('btn-bet').addEventListener('click', prepareLaunch);
        document.getElementById('btn-sim').addEventListener('click', runMonteCarlo);

        updateWorldEntities();
        applyCamera(true);
    </script>
</body>
</html>
